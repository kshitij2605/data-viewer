# nginx reverse proxy for Data Viewer.
# - Terminates client connections, fronts the gunicorn/uvicorn app.
# - Caches immutable document images/thumbnails (offloads the backend's MinIO proxy).
# - Streams SSE endpoints without buffering.
# - gzip for JSON/text; basic connection & request rate limiting.

# Cache for proxied document assets (images, thumbnails, markdown). MinIO objects
# are immutable per document, so they are safe to cache by path.
proxy_cache_path /var/cache/nginx/data_viewer levels=1:2 keys_zone=dv_assets:50m
                 max_size=5g inactive=7d use_temp_path=off;

# Rate / connection limits keyed by client IP.
limit_conn_zone   $binary_remote_addr zone=dv_conn:10m;
limit_req_zone    $binary_remote_addr zone=dv_req:10m rate=30r/s;

upstream data_viewer_app {
    server data-viewer:8080;
    keepalive 32;
}

gzip on;
gzip_types application/json text/plain text/css application/javascript application/xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name _;

    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/server.crt;
    # ssl_certificate_key /etc/nginx/certs/server.key;

    client_max_body_size 50m;

    limit_conn dv_conn 50;
    limit_req  zone=dv_req burst=60 nodelay;

    # ---- SSE endpoints: no buffering, long timeouts ----
    location ~ ^/api/documents/[0-9]+/(evaluate-chunks|chunk-status) {
        proxy_pass http://data_viewer_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---- Cacheable immutable document assets (images, thumbnails, markdown, pdf) ----
    location ~ ^/api/documents/[0-9]+/(layout-thumbnail/|layout-pdf|images/|tables/|markdown|page/[0-9]+/(thumbnail|markdown)) {
        proxy_pass http://data_viewer_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache dv_assets;
        # Ignore the ?token= query arg in the cache key so all users share one
        # cached copy of the (immutable) asset. Token is still validated by the
        # backend on a cache MISS. Acceptable for an internal tool.
        proxy_cache_key "$scheme$request_method$host$uri";
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ---- Everything else (API + SPA) ----
    location / {
        proxy_pass http://data_viewer_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
